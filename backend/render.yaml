services:
  - type: web
    name: sistema-manutencao-api
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm run start:migrate
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: COOKIE_CROSS_ORIGIN
        value: true
      # Defina no painel do Render (nunca commite valores reais):
      # DATABASE_URL, JWT_SECRET, FRONTEND_URL
