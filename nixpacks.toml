# nixpacks.toml (raiz do monorepo)
# Builda o backend NestJS mesmo com o Build Path do Dokploy em "/".
# O provider de Node do Nixpacks (acionado pelo package.json da raiz) instala
# o Node 22; aqui só sobrescrevemos install/build/start para rodar no backend.

[phases.install]
cmds = ["cd backend && npm ci --include=dev"]

[phases.build]
cmds = ["cd backend && npm run build"]

# Aplica migrations pendentes e sobe o servidor compilado (backend/dist/main.js).
[start]
cmd = "cd backend && npx prisma migrate deploy && node dist/main.js"
